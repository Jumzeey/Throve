# Codemagic CI/CD for this Expo React Native app.
# Native android/ and ios/ are generated on the build machine with `npx expo prebuild`.
#
# In the Codemagic UI:
# 1. Add this repository as a React Native app, then scan for this file.
# 2. Android signing — Team settings > codemagic.yaml settings > Code signing identities:
#    upload a keystore and set its Reference name to `throve`.
# 3. iOS signing — add an App Store Connect integration + iOS code signing for
#    bundle id `com.throve.app`, then set `integrations.app_store_connect` below
#    to match your integration name (default placeholder: `codemagic`).
# 4. Environment groups (Team settings > Global variables and secrets):
#    - `throve_frontend` — set all of these in the UI (do not hardcode in this file):
#        EXPO_PUBLIC_SUPABASE_URL
#        EXPO_PUBLIC_SUPABASE_ANON_KEY
#        EXPO_PUBLIC_API_URL          (must be hosted backend, e.g. Railway — not localhost)
#        EXPO_PUBLIC_AUTH_REDIRECT_URL (e.g. throveapp://auth/callback)
#    - `google_play` — GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS (Play service-account JSON)
# 5. Mark secret values as Secure in the UI.
# 6. Caching — configured per workflow below via `cache.cache_paths`. After the next
#    successful build, entries appear under the Caching tab (Refresh list).
#    Each workflow has its own cache.
#
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-react-native-app/
# Cache docs: https://docs.codemagic.io/knowledge-codemagic/caching/

workflows:
  react-native-android:
    name: React Native Android
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: 22.13.1
      android_signing:
        - throve
      groups:
        - throve_frontend
        - google_play
      vars:
        PACKAGE_NAME: "com.throve.app"
    cache:
      cache_paths:
        # npm global cache (safer across lockfile bumps than only node_modules)
        - $HOME/.npm
        # installed frontend deps
        - $CM_BUILD_DIR/frontend/node_modules
        # Android Gradle dependency jars (do not cache all of $HOME/.gradle)
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Install npm dependencies
        script: |
          cd frontend
          npm install
      - name: Write Expo env file
        script: |
          set -e
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || { echo "Missing EXPO_PUBLIC_SUPABASE_URL in throve_frontend group"; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY" || { echo "Missing EXPO_PUBLIC_SUPABASE_ANON_KEY in throve_frontend group"; exit 1; }
          test -n "$EXPO_PUBLIC_API_URL" || { echo "Missing EXPO_PUBLIC_API_URL in throve_frontend group"; exit 1; }
          test -n "$EXPO_PUBLIC_AUTH_REDIRECT_URL" || { echo "Missing EXPO_PUBLIC_AUTH_REDIRECT_URL in throve_frontend group"; exit 1; }

          case "$EXPO_PUBLIC_API_URL" in
            *localhost*|*127.0.0.1*)
              echo "EXPO_PUBLIC_API_URL must not be localhost for store builds: $EXPO_PUBLIC_API_URL"
              exit 1
              ;;
          esac

          printf '%s\n' \
            "EXPO_PUBLIC_SUPABASE_URL=$EXPO_PUBLIC_SUPABASE_URL" \
            "EXPO_PUBLIC_SUPABASE_ANON_KEY=$EXPO_PUBLIC_SUPABASE_ANON_KEY" \
            "EXPO_PUBLIC_API_URL=$EXPO_PUBLIC_API_URL" \
            "EXPO_PUBLIC_AUTH_REDIRECT_URL=$EXPO_PUBLIC_AUTH_REDIRECT_URL" \
            > frontend/.env
          echo "Wrote frontend/.env (API → $EXPO_PUBLIC_API_URL)"
      - name: Run Expo Prebuild
        script: |
          cd frontend
          npx expo prebuild --platform android --non-interactive
      - name: Set up app/build.gradle
        script: |
          cp ./support-files/build.gradle frontend/android/app/build.gradle
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/frontend/android/local.properties"
      - name: Build Android release
        script: |
          cd frontend
          LATEST_GOOGLE_PLAY_BUILD_NUMBER=""
          if [ -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS:-}" ]; then
            LATEST_GOOGLE_PLAY_BUILD_NUMBER=$(google-play get-latest-build-number --package-name "$PACKAGE_NAME" || true)
          fi
          if [ -z "$LATEST_GOOGLE_PLAY_BUILD_NUMBER" ]; then
            UPDATED_BUILD_NUMBER=$BUILD_NUMBER
          else
            UPDATED_BUILD_NUMBER=$((LATEST_GOOGLE_PLAY_BUILD_NUMBER + 1))
          fi
          cd android
          ./gradlew bundleRelease \
            -PversionCode=$UPDATED_BUILD_NUMBER \
            -PversionName=1.0.$UPDATED_BUILD_NUMBER
    artifacts:
      - frontend/android/app/build/outputs/**/*.aab
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: alpha
        submit_as_draft: false

  # Manual only (Start new build). Wire App Store Connect + ios_signing before enabling IPA publish.
  react-native-ios:
    name: React Native iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      node: 22.13.1
      xcode: latest
      cocoapods: default
      groups:
        - throve_frontend
      vars:
        BUNDLE_ID: "com.throve.app"
        # Expo prebuild uses app.json "name" → ios/throve.xcworkspace + scheme throve
        XCODE_WORKSPACE: "throve.xcworkspace"
        XCODE_SCHEME: "throve"
    cache:
      cache_paths:
        - $HOME/.npm
        - $CM_BUILD_DIR/frontend/node_modules
        # CocoaPods
        - $HOME/Library/Caches/CocoaPods
        # Swift Package Manager (global)
        - $HOME/Library/Caches/org.swift.swiftpm
        # Xcode compilation cache (not full DerivedData)
        - $HOME/Library/Developer/Xcode/DerivedData/CompilationCache.noindex
    scripts:
      - name: Install npm dependencies
        script: |
          cd frontend
          npm install
      - name: Write Expo env file
        script: |
          set -e
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || { echo "Missing EXPO_PUBLIC_SUPABASE_URL in throve_frontend group"; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_ANON_KEY" || { echo "Missing EXPO_PUBLIC_SUPABASE_ANON_KEY in throve_frontend group"; exit 1; }
          test -n "$EXPO_PUBLIC_API_URL" || { echo "Missing EXPO_PUBLIC_API_URL in throve_frontend group"; exit 1; }
          test -n "$EXPO_PUBLIC_AUTH_REDIRECT_URL" || { echo "Missing EXPO_PUBLIC_AUTH_REDIRECT_URL in throve_frontend group"; exit 1; }

          case "$EXPO_PUBLIC_API_URL" in
            *localhost*|*127.0.0.1*)
              echo "EXPO_PUBLIC_API_URL must not be localhost for store builds: $EXPO_PUBLIC_API_URL"
              exit 1
              ;;
          esac

          printf '%s\n' \
            "EXPO_PUBLIC_SUPABASE_URL=$EXPO_PUBLIC_SUPABASE_URL" \
            "EXPO_PUBLIC_SUPABASE_ANON_KEY=$EXPO_PUBLIC_SUPABASE_ANON_KEY" \
            "EXPO_PUBLIC_API_URL=$EXPO_PUBLIC_API_URL" \
            "EXPO_PUBLIC_AUTH_REDIRECT_URL=$EXPO_PUBLIC_AUTH_REDIRECT_URL" \
            > frontend/.env
          echo "Wrote frontend/.env (API → $EXPO_PUBLIC_API_URL)"
      - name: Run Expo Prebuild
        script: |
          cd frontend
          npx expo prebuild --platform ios --non-interactive
      - name: Install CocoaPods dependencies
        script: |
          cd frontend/ios
          pod install
      - name: Verify Xcode workspace
        script: |
          test -d "$CM_BUILD_DIR/frontend/ios/$XCODE_WORKSPACE" \
            || test -d "$CM_BUILD_DIR/frontend/ios/${XCODE_SCHEME}.xcworkspace" \
            || ls frontend/ios
          echo "iOS project ready. Add ios_signing + App Store Connect to produce an IPA."
    artifacts:
      - /tmp/xcodebuild_logs/*.log
